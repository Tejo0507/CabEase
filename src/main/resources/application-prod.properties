# Production-ready database configuration (PostgreSQL)
# Using individual database connection components from Render
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cabease}
spring.datasource.username=${DB_USER:cabease}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning (production starter defaults + safe values)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.pool-name=CabEaseHikariCP

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=INFO

# Server configuration
server.port=${PORT:8080}

# Flyway - DISABLED to avoid circular dependency (using Hibernate update mode instead)
spring.flyway.enabled=false

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging adjustments
logging.level.org.springframework=INFO
logging.level.com.cabease=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:tejo.singaporeserver@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google API Keys
google.maps.api.key=${GOOGLE_MAPS_API_KEY}
google.ai.api.key=${GOOGLE_AI_API_KEY}

# Security (do not disable CSRF in production)
security.require-ssl=false

# Payment Gateway Configuration
# Set payment.gateway.mode to 'mock' for development without real gateway
# Set to 'razorpay' when you have real credentials
payment.gateway.mode=${PAYMENT_GATEWAY_MODE:mock}

# Razorpay Payment Gateway Configuration (Only needed when mode=razorpay)
# Get your keys from: https://dashboard.razorpay.com/app/keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_demo}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:demo_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_secret}
razorpay.currency=INR

# NOTE: With mode=mock, you can develop and test without any gateway signup!
# Switch to mode=razorpay when you have real keys
