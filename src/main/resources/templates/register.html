<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join CabEase - Premium Cab Booking Service</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'Poppins', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slide-up 0.8s ease-out',
                        'fade-in': 'fade-in 1s ease-out',
                        'shake': 'shake 0.5s ease-in-out',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                        'tilt': 'tilt 0.3s ease-in-out',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        'glow': {
                            'from': { 'box-shadow': '0 0 20px rgba(245, 158, 11, 0.5)' },
                            'to': { 'box-shadow': '0 0 30px rgba(245, 158, 11, 0.8)' },
                        },
                        'slide-up': {
                            'from': { transform: 'translateY(100px)', opacity: '0' },
                            'to': { transform: 'translateY(0)', opacity: '1' },
                        },
                        'fade-in': {
                            'from': { opacity: '0' },
                            'to': { opacity: '1' },
                        },
                        'shake': {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-5px)' },
                            '75%': { transform: 'translateX(5px)' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { 
                                'box-shadow': '0 0 20px rgba(245, 158, 11, 0.3)',
                                'border-color': 'rgba(245, 158, 11, 0.5)'
                            },
                            '50%': { 
                                'box-shadow': '0 0 40px rgba(245, 158, 11, 0.6)',
                                'border-color': 'rgba(245, 158, 11, 0.8)'
                            },
                        },
                        'tilt': {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(1deg)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Heroicons -->
    <script src="https://unpkg.com/@heroicons/react@2.0.18/24/outline/index.js" type="module"></script>

    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dark .glass-morphism {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #f59e0b, #eab308, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-bg {
            background: linear-gradient(135deg, #111827, #000000, #374151);
        }

        .dark .hero-bg {
            background: linear-gradient(135deg, #111827, #312e81, #7c3aed);
        }

        .moving-grid {
            background-image: 
                linear-gradient(90deg, transparent 49%, rgba(245, 158, 11, 0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(245, 158, 11, 0.1) 50%, transparent 51%);
            background-size: 50px 50px;
            animation: gradient-x 20s ease infinite;
        }

        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
            border-color: #f59e0b;
        }

        .loading-spinner {
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #f59e0b, #eab308);
            border-radius: 10px;
        }

        .car-animation {
            position: absolute;
            top: 20%;
            right: 5%;
            opacity: 0.2;
            animation: float 8s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-sans antialiased dark transition-colors duration-500">
    
    <!-- Animated Background -->
    <div class="fixed inset-0">
        <div class="absolute inset-0 hero-bg"></div>
        
        <!-- Moving Grid Animation -->
        <div class="absolute inset-0 opacity-20">
            <div class="w-full h-full moving-grid"></div>
        </div>

        <!-- Animated Car -->
        <div class="car-animation hidden md:block">
            <svg class="w-20 h-20 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
        </div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            
            <!-- Header Section -->
            <div class="text-center mb-8 animate-fade-in">
                <!-- Logo -->
                <a href="/" class="inline-block mb-4 group">
                    <div class="flex items-center justify-center space-x-2 group-hover:scale-105 transition-transform duration-300">
                        <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <span class="text-2xl font-bold gradient-text">CabEase</span>
                    </div>
                </a>
                
                <!-- Tagline -->
                <p class="text-gray-300 text-lg font-medium">
                    Join the ride — experience luxury on the move
                </p>
            </div>

            <!-- Sign-Up Form Card -->
            <div class="glass-morphism rounded-3xl p-8 shadow-2xl hover:shadow-amber-500/10 transition-all duration-500 hover:scale-[1.02] animate-slide-up"
                 style="animation-delay: 0.3s;">
                
                <!-- Form Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-white mb-2">
                        Create Account
                    </h1>
                    <p class="text-gray-400">
                        Join thousands of satisfied customers
                    </p>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/register}" th:object="${user}" method="post" id="signupForm" class="space-y-6">
                    
                    <!-- Name Field -->
                    <div class="space-y-2">
                        <label for="name" class="text-sm font-semibold text-gray-300 flex items-center space-x-2">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span>Full Name</span>
                        </label>
                        <input type="text" 
                               id="name" 
                               th:field="*{name}" 
                               required
                               class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none input-glow transition-all duration-300 hover:bg-white/15"
                               placeholder="Enter your full name">
                        <div th:if="${#fields.hasErrors('name')}" class="text-red-400 text-sm flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span th:errors="*{name}"></span>
                        </div>
                        <div th:if="${nameError}" class="text-red-400 text-sm flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span th:text="${nameError}"></span>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="space-y-2">
                        <label for="email" class="text-sm font-semibold text-gray-300 flex items-center space-x-2">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            <span>Email Address</span>
                        </label>
                        <input type="email" 
                               id="email" 
                               th:field="*{email}" 
                               required
                               class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none input-glow transition-all duration-300 hover:bg-white/15"
                               placeholder="Enter your email address">
                        <div th:if="${#fields.hasErrors('email')}" class="text-red-400 text-sm flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span th:errors="*{email}"></span>
                        </div>
                        <div th:if="${emailError}" class="text-red-400 text-sm flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span th:text="${emailError}"></span>
                        </div>
                    </div>


                    <!-- Password Field -->
                    <div class="space-y-2">
                        <label for="password" class="text-sm font-semibold text-gray-300 flex items-center space-x-2">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <span>Password</span>
                        </label>
                        <div class="relative">
                            <input type="password" 
                                   id="password" 
                                   th:field="*{password}" 
                                   required
                                   class="w-full px-4 py-3 pr-12 bg-white/10 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none input-glow transition-all duration-300 hover:bg-white/15"
                                   placeholder="Create a secure password">
                            <button type="button" 
                                    id="togglePassword"
                                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-amber-400 transition-colors duration-300">
                                <svg id="eyeOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                                </svg>
                            </button>
                        </div>
                        <div th:if="${#fields.hasErrors('password')}" class="text-red-400 text-sm flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="space-y-2">
                        <label for="confirmPassword" class="text-sm font-semibold text-gray-300 flex items-center space-x-2">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span>Confirm Password</span>
                        </label>
                        <input type="password" 
                               id="confirmPassword" 
                               name="confirmPassword"
                               required
                               class="w-full px-4 py-3 bg-white/10 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none input-glow transition-all duration-300 hover:bg-white/15"
                               placeholder="Confirm your password">
                        <div id="passwordMismatch" class="text-red-400 text-sm hidden flex items-center space-x-2 animate-shake">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span>Passwords do not match</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                            id="submitBtn"
                            class="w-full px-6 py-4 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-black font-bold rounded-xl text-lg shadow-2xl hover:shadow-amber-500/25 transition-all duration-300 hover:scale-105 animate-glow flex items-center justify-center space-x-3 group disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="submitText">Create Account</span>
                        <div id="loadingSpinner" class="loading-spinner hidden"></div>
                        <svg id="submitIcon" class="w-6 h-6 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                    </button>
                </form>

                <!-- Login Link -->
                <div class="text-center mt-6 pt-6 border-t border-gray-600">
                    <p class="text-gray-400">
                        Already have an account? 
                        <a th:href="@{/login}" 
                           class="text-amber-400 hover:text-amber-300 font-semibold transition-colors duration-300 hover:underline ml-1">
                            Login here
                        </a>
                    </p>
                </div>

                <!-- Premium Benefits -->
                <div class="mt-6 pt-4 border-t border-gray-700">
                    <div class="text-center">
                        <p class="text-gray-400 text-sm mb-3 flex items-center justify-center space-x-2">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"></path>
                            </svg>
                            <span>Premium Benefits</span>
                        </p>
                        <div class="grid grid-cols-3 gap-4 text-xs">
                            <div class="flex flex-col items-center space-y-1">
                                <div class="w-8 h-8 bg-amber-400/20 rounded-full flex items-center justify-center">
                                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>
                                </div>
                                <span class="text-gray-400">Priority Booking</span>
                            </div>
                            <div class="flex flex-col items-center space-y-1">
                                <div class="w-8 h-8 bg-amber-400/20 rounded-full flex items-center justify-center">
                                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                </div>
                                <span class="text-gray-400">24/7 Support</span>
                            </div>
                            <div class="flex flex-col items-center space-y-1">
                                <div class="w-8 h-8 bg-amber-400/20 rounded-full flex items-center justify-center">
                                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                                    </svg>
                                </div>
                                <span class="text-gray-400">Luxury Fleet</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-8 animate-fade-in" style="animation-delay: 0.8s;">
                <p class="text-gray-500 text-sm">
                    © 2025 CabEase. All Rights Reserved.
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        togglePassword.addEventListener('click', () => {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            
            eyeOpen.classList.toggle('hidden');
            eyeClosed.classList.toggle('hidden');
        });

        // Password confirmation validation
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordMismatch = document.getElementById('passwordMismatch');

        function validatePasswords() {
            if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
                passwordMismatch.classList.remove('hidden');
                confirmPasswordInput.classList.add('border-red-500');
                confirmPasswordInput.classList.remove('border-gray-600');
                return false;
            } else {
                passwordMismatch.classList.add('hidden');
                confirmPasswordInput.classList.remove('border-red-500');
                confirmPasswordInput.classList.add('border-gray-600');
                return true;
            }
        }

        confirmPasswordInput.addEventListener('input', validatePasswords);
        passwordInput.addEventListener('input', validatePasswords);

        // Form submission with loading state
        const signupForm = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const submitIcon = document.getElementById('submitIcon');

        signupForm.addEventListener('submit', (e) => {
            if (!validatePasswords()) {
                e.preventDefault();
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitText.textContent = 'Creating Account...';
            loadingSpinner.classList.remove('hidden');
            submitIcon.classList.add('hidden');
        });

        // Input focus animations
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('animate-pulse-glow');
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('animate-pulse-glow');
            });
        });

        // Form validation animations
        const form = document.getElementById('signupForm');
        form.addEventListener('invalid', (e) => {
            e.target.classList.add('animate-shake');
            setTimeout(() => {
                e.target.classList.remove('animate-shake');
            }, 500);
        });

        // Hover tilt effect on form card
        const formCard = document.querySelector('.glass-morphism');
        formCard.addEventListener('mouseenter', () => {
            formCard.classList.add('animate-tilt');
        });
        
        formCard.addEventListener('mouseleave', () => {
            formCard.classList.remove('animate-tilt');
        });

        // Success/Error message handling
        document.addEventListener('DOMContentLoaded', () => {
            const errorMessages = document.querySelectorAll('[th\\:if*="Error"]');
            errorMessages.forEach(message => {
                if (message.textContent.trim()) {
                    message.classList.add('animate-shake');
                }
            });
        });
    </script>
</body>
</html>
