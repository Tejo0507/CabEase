<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Ride - CabEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SockJS and STOMP for WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjyzQGcwNLjqnE-aF0uaWaaJbIhLUZ9Ss&libraries=places,geometry&callback=initMap" async defer></script>
    
    <style>
        :root {
            --primary-dark: #1a1a2e;
            --secondary-dark: #16213e;
            --accent-dark: #0f3460;
            --gold-accent: #fbbf24;
            --teal-accent: #14b8a6;
            --orange-accent: #ff6b35;
            --success-green: #22c55e;
            --error-red: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-dark);
            overflow: hidden;
            height: 100vh;
        }

        /* Full Screen Map Container */
        #map {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Floating Header */
        .tracking-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 30px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .tracking-header h1 {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .connection-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success-green);
            animation: pulse 2s infinite;
        }

        .connection-status.disconnected {
            background: var(--error-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Driver Info Card */
        .driver-card {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            z-index: 1000;
            width: 350px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .driver-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .driver-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-accent), var(--orange-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }

        .driver-details h3 {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .driver-details p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .vehicle-info {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .vehicle-row {
            display: flex;
            justify-content: space-between;
            color: white;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .vehicle-row:last-child {
            margin-bottom: 0;
        }

        .vehicle-row span:first-child {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ETA Display */
        .eta-display {
            background: linear-gradient(135deg, var(--teal-accent), var(--success-green));
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .eta-time {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .eta-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        .distance-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-call {
            background: var(--success-green);
            color: white;
        }

        .btn-call:hover {
            background: #1ea34e;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: var(--error-red);
            color: white;
        }

        .btn-cancel:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* Status Badge */
        .status-badge {
            position: fixed;
            top: 100px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 25px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .status-badge h4 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .status-text {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--teal-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px 20px;
            z-index: 1000;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        /* Custom Map Markers */
        .driver-marker {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--gold-accent), var(--orange-accent));
            border-radius: 50% 50% 0 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            transform: rotate(-45deg);
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.5);
            animation: driverPulse 2s infinite;
        }

        .driver-marker i {
            transform: rotate(45deg);
        }

        @keyframes driverPulse {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(251, 191, 36, 0.5);
            }
            50% {
                box-shadow: 0 4px 24px rgba(251, 191, 36, 0.8);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .driver-card {
                width: calc(100% - 40px);
                left: 20px;
                right: 20px;
            }

            .tracking-header {
                width: calc(100% - 40px);
                left: 20px;
                transform: none;
            }

            .status-badge {
                right: 20px;
                left: 20px;
                top: auto;
                bottom: 400px;
            }
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Connecting to driver...</div>
            <div class="loading-subtext" id="loadingSubtext">Establishing real-time tracking</div>
            <div style="margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 11px; max-width: 400px;" id="debugInfo"></div>
        </div>
    </div>

    <!-- Back Button -->
    <a href="/booking-dashboard" class="back-button">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Dashboard</span>
    </a>

    <!-- Tracking Header -->
    <div class="tracking-header">
        <div class="connection-status" id="connectionStatus"></div>
        <h1><i class="fas fa-location-dot"></i> Live Tracking</h1>
    </div>

    <!-- Status Badge -->
    <div class="status-badge">
        <h4>Ride Status</h4>
        <div class="status-text" id="rideStatus">
            <i class="fas fa-circle-notch fa-spin status-icon"></i>
            <span>Connecting...</span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Driver Info Card -->
    <div class="driver-card" id="driverCard" style="display: none;">
        <!-- ETA Display -->
        <div class="eta-display">
            <div class="eta-time" id="etaTime">--</div>
            <div class="eta-label">minutes away</div>
            <div class="distance-info" id="distanceInfo">Calculating distance...</div>
        </div>

        <!-- Driver Info -->
        <div class="driver-info">
            <div class="driver-avatar" id="driverAvatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="driver-details">
                <h3 id="driverName">Loading...</h3>
                <p id="driverPhone">---</p>
            </div>
        </div>

        <!-- Vehicle Info -->
        <div class="vehicle-info">
            <div class="vehicle-row">
                <span>Vehicle</span>
                <span id="vehicleModel">---</span>
            </div>
            <div class="vehicle-row">
                <span>Number</span>
                <span id="vehicleNumber" style="font-weight: 600; color: var(--gold-accent);">---</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-call" onclick="callDriver()">
                <i class="fas fa-phone"></i>
                Call Driver
            </button>
            <button class="btn btn-cancel" onclick="cancelRide()">
                <i class="fas fa-times-circle"></i>
                Cancel Ride
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Global variables
        let map;
        let driverMarker;
        let pickupMarker;
        let dropMarker;
        let routePolyline;
        let stompClient = null;
        let isConnected = false;
        let rideId = null;
        let driverPosition = null;

        // Get ride ID from URL parameter
        function getRideIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('rideId');
        }

        // Initialize Map
        function initMap() {
            // Default center (Chennai)
            const defaultCenter = { lat: 13.0827, lng: 80.2707 };

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                center: defaultCenter,
                styles: [
                    {
                        "featureType": "all",
                        "elementType": "geometry",
                        "stylers": [{"color": "#242f3e"}]
                    },
                    {
                        "featureType": "all",
                        "elementType": "labels.text.stroke",
                        "stylers": [{"color": "#242f3e"}]
                    },
                    {
                        "featureType": "all",
                        "elementType": "labels.text.fill",
                        "stylers": [{"color": "#746855"}]
                    },
                    {
                        "featureType": "water",
                        "elementType": "geometry",
                        "stylers": [{"color": "#17263c"}]
                    },
                    {
                        "featureType": "road",
                        "elementType": "geometry",
                        "stylers": [{"color": "#38414e"}]
                    }
                ],
                disableDefaultUI: false,
                zoomControl: true,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: true
            });

            // Start loading tracking data
            loadTrackingData();
        }

        // Load initial tracking data
        async function loadTrackingData() {
            rideId = getRideIdFromURL();
            
            updateDebugInfo('Step 1: Got ride ID: ' + rideId);
            
            if (!rideId) {
                showToast('❌ Invalid ride ID');
                setTimeout(() => {
                    window.location.href = '/booking-dashboard';
                }, 2000);
                return;
            }

            try {
                updateDebugInfo('Step 2: Fetching tracking data from /api/v1/tracking/' + rideId);
                const response = await fetch(`/api/v1/tracking/${rideId}`);
                const data = await response.json();
                
                updateDebugInfo('Step 3: Received response: ' + JSON.stringify(data).substring(0, 100));

                if (data.error) {
                    // Tracking session doesn't exist yet - try to create it
                    updateDebugInfo('Step 4: No session found. Creating...');
                    
                    try {
                        const startResponse = await fetch(`/api/v1/tracking/start/${rideId}`, { method: 'POST' });
                        const startResult = await startResponse.json();
                        
                        if (startResult.success) {
                            updateDebugInfo('Step 5: Session created! Retrying in 2 seconds...');
                            // Retry loading tracking data
                            setTimeout(loadTrackingData, 2000);
                            return;
                        } else {
                            updateDebugInfo('❌ Failed to create session: ' + startResult.error);
                            showToast('❌ Failed to start tracking: ' + (startResult.error || 'Unknown error'));
                            document.getElementById('loadingText').textContent = 'Failed to start tracking';
                            document.getElementById('loadingSubtext').textContent = startResult.error || 'Unknown error';
                            return;
                        }
                    } catch (startError) {
                        console.error('❌ Error starting tracking:', startError);
                        updateDebugInfo('❌ Start tracking error: ' + startError.message);
                        showToast('❌ ' + data.error);
                        document.getElementById('loadingText').textContent = 'Connection failed';
                        document.getElementById('loadingSubtext').textContent = 'Please refresh the page';
                        return;
                    }
                }

                // Validate required data
                if (!data.driverLatitude || !data.driverLongitude || !data.pickupLatitude || !data.pickupLongitude) {
                    console.error('❌ Invalid tracking data:', data);
                    updateDebugInfo('❌ Invalid data: Missing coordinates');
                    showToast('❌ Incomplete tracking data');
                    document.getElementById('loadingText').textContent = 'Data incomplete';
                    document.getElementById('loadingSubtext').textContent = 'Please contact support';
                    return;
                }

                updateDebugInfo('Step 6: Data validated. Initializing UI...');

                // Update UI with tracking data
                updateUI(data);

                // Initialize markers
                initializeMarkers(data);

                updateDebugInfo('Step 7: Connecting to WebSocket...');

                // Connect to WebSocket
                connectWebSocket();

                // Hide loading overlay after short delay
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('driverCard').style.display = 'block';
                    updateDebugInfo('✅ Tracking initialized successfully!');
                }, 1000);
                
                console.log('✅ Tracking initialized successfully');

            } catch (error) {
                console.error('❌ Error loading tracking data:', error);
                updateDebugInfo('❌ Fatal error: ' + error.message);
                showToast('❌ Failed to load tracking data: ' + error.message);
                document.getElementById('loadingText').textContent = 'Connection failed';
                document.getElementById('loadingSubtext').textContent = error.message;
            }
        }
        
        // Helper function to update debug info
        function updateDebugInfo(message) {
            const debugDiv = document.getElementById('debugInfo');
            if (debugDiv) {
                const timestamp = new Date().toLocaleTimeString();
                debugDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
                debugDiv.scrollTop = debugDiv.scrollHeight;
            }
            console.log('[DEBUG]', message);
        }

        // Initialize markers on map
        function initializeMarkers(data) {
            // Driver marker (custom HTML marker)
            driverPosition = {
                lat: parseFloat(data.driverLatitude),
                lng: parseFloat(data.driverLongitude)
            };

            driverMarker = new google.maps.Marker({
                position: driverPosition,
                map: map,
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="25" cy="25" r="20" fill="#fbbf24"/>
                            <text x="25" y="32" font-size="20" text-anchor="middle" fill="white">🚗</text>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(50, 50),
                    anchor: new google.maps.Point(25, 25)
                },
                title: 'Your Driver',
                animation: google.maps.Animation.DROP
            });

            // Pickup marker
            const pickupPosition = {
                lat: parseFloat(data.pickupLatitude),
                lng: parseFloat(data.pickupLongitude)
            };

            pickupMarker = new google.maps.Marker({
                position: pickupPosition,
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 12,
                    fillColor: '#14b8a6',
                    fillOpacity: 1,
                    strokeColor: '#fff',
                    strokeWeight: 3
                },
                title: 'Pickup Location'
            });

            // Drop marker
            const dropPosition = {
                lat: parseFloat(data.dropLatitude),
                lng: parseFloat(data.dropLongitude)
            };

            dropMarker = new google.maps.Marker({
                position: dropPosition,
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 12,
                    fillColor: '#ef4444',
                    fillOpacity: 1,
                    strokeColor: '#fff',
                    strokeWeight: 3
                },
                title: 'Drop Location'
            });

            // Draw route from driver to pickup
            drawRoute(driverPosition, pickupPosition);

            // Fit map to show all markers
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(driverPosition);
            bounds.extend(pickupPosition);
            bounds.extend(dropPosition);
            map.fitBounds(bounds);
        }

        // Draw route polyline
        function drawRoute(start, end) {
            if (routePolyline) {
                routePolyline.setMap(null);
            }

            const directionsService = new google.maps.DirectionsService();
            
            directionsService.route({
                origin: start,
                destination: end,
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === 'OK') {
                    routePolyline = new google.maps.Polyline({
                        path: result.routes[0].overview_path,
                        geodesic: true,
                        strokeColor: '#fbbf24',
                        strokeOpacity: 0.8,
                        strokeWeight: 4,
                        map: map
                    });
                }
            });
        }

        // Update UI with tracking data
        function updateUI(data) {
            // Update driver info
            document.getElementById('driverName').textContent = data.driverName || 'Unknown';
            document.getElementById('driverPhone').textContent = data.driverPhone || '---';
            document.getElementById('vehicleModel').textContent = data.vehicleModel || '---';
            document.getElementById('vehicleNumber').textContent = data.vehicleNumber || '---';

            // Update driver avatar initial
            if (data.driverName) {
                const initial = data.driverName.charAt(0).toUpperCase();
                document.getElementById('driverAvatar').innerHTML = initial;
            }

            // Update ETA
            document.getElementById('etaTime').textContent = data.etaMinutes || '--';
            
            // Update distance
            if (data.distanceToPickup) {
                const distance = parseFloat(data.distanceToPickup);
                document.getElementById('distanceInfo').textContent = 
                    `${distance.toFixed(1)} km to pickup location`;
            }

            // Update status
            updateRideStatus(data.status);
        }

        // Update ride status
        function updateRideStatus(status) {
            const statusElement = document.getElementById('rideStatus');
            let icon = '<i class="fas fa-circle-notch fa-spin status-icon"></i>';
            let text = status;

            switch(status) {
                case 'CONFIRMED':
                    icon = '<i class="fas fa-car status-icon"></i>';
                    text = 'Driver on the way';
                    break;
                case 'IN_PROGRESS':
                    icon = '<i class="fas fa-route status-icon"></i>';
                    text = 'Trip in progress';
                    break;
                case 'COMPLETED':
                    icon = '<i class="fas fa-check-circle status-icon"></i>';
                    text = 'Trip completed';
                    break;
                case 'CANCELLED':
                    icon = '<i class="fas fa-times-circle status-icon"></i>';
                    text = 'Trip cancelled';
                    break;
            }

            statusElement.innerHTML = `${icon} <span>${text}</span>`;
        }

        // Connect to WebSocket
        function connectWebSocket() {
            console.log('🔌 Connecting to WebSocket...');
            
            try {
                const socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);

                // Disable debug logging
                stompClient.debug = null;
                
                // Set heartbeat (30 seconds)
                stompClient.heartbeat.outgoing = 30000;
                stompClient.heartbeat.incoming = 30000;

                // Connection timeout
                const connectionTimeout = setTimeout(() => {
                    if (!isConnected) {
                        console.error('❌ WebSocket connection timeout');
                        showToast('❌ Connection timeout. Retrying...');
                        connectWebSocket();
                    }
                }, 10000); // 10 second timeout

                stompClient.connect({}, function(frame) {
                    clearTimeout(connectionTimeout);
                    console.log('✅ Connected to WebSocket:', frame);
                    isConnected = true;
                    updateConnectionStatus(true);

                    // Subscribe to ride-specific topic
                    stompClient.subscribe(`/topic/ride/${rideId}`, function(message) {
                        console.log('📨 WebSocket message received:', message.body);
                        const data = JSON.parse(message.body);
                        handleLocationUpdate(data);
                    });

                    // Start tracking on server (triggers simulator)
                    fetch(`/api/v1/tracking/start/${rideId}`, { method: 'POST' })
                        .then(response => response.json())
                        .then(result => {
                            if (result.success) {
                                console.log('✅ Tracking activated on server');
                                showToast('✅ Live tracking activated');
                            } else {
                                console.warn('⚠️ Tracking already active or failed:', result);
                            }
                        })
                        .catch(error => console.error('❌ Error starting tracking:', error));

                }, function(error) {
                    clearTimeout(connectionTimeout);
                    console.error('❌ WebSocket connection error:', error);
                    isConnected = false;
                    updateConnectionStatus(false);
                    showToast('❌ Connection lost. Reconnecting...');
                    
                    // Retry connection after 3 seconds
                    setTimeout(connectWebSocket, 3000);
                });
            } catch (error) {
                console.error('❌ WebSocket initialization error:', error);
                showToast('❌ Failed to initialize connection');
                setTimeout(connectWebSocket, 5000);
            }
        }

        // Handle location update from WebSocket
        function handleLocationUpdate(data) {
            console.log('Location update received:', data);

            if (data.event === 'LOCATION_UPDATE') {
                // Update driver position with smooth animation
                const newPosition = {
                    lat: parseFloat(data.driverLatitude),
                    lng: parseFloat(data.driverLongitude)
                };

                // Animate marker movement
                animateMarker(driverMarker, newPosition);

                // Update ETA and distance
                document.getElementById('etaTime').textContent = data.etaMinutes || '--';
                
                if (data.distanceToPickup) {
                    const distance = parseFloat(data.distanceToPickup);
                    document.getElementById('distanceInfo').textContent = 
                        `${distance.toFixed(1)} km to pickup location`;
                }

                // Update route
                const pickupPosition = pickupMarker.getPosition();
                drawRoute(newPosition, pickupPosition);

                // Update status
                if (data.status) {
                    updateRideStatus(data.status);
                }

                driverPosition = newPosition;
            } else if (data.event === 'TRACKING_ENDED') {
                showToast('🏁 Ride tracking ended');
                disconnect();
            } else if (data.event === 'STATUS_CHANGED') {
                updateRideStatus(data.status);
                showToast(`📍 Status: ${data.message}`);
            }
        }

        // Animate marker movement
        function animateMarker(marker, newPosition) {
            const currentPosition = marker.getPosition();
            const deltaLat = (newPosition.lat - currentPosition.lat()) / 30;
            const deltaLng = (newPosition.lng - currentPosition.lng()) / 30;
            let step = 0;

            const animate = setInterval(() => {
                step++;
                const lat = currentPosition.lat() + (deltaLat * step);
                const lng = currentPosition.lng() + (deltaLng * step);
                marker.setPosition({ lat, lng });

                if (step >= 30) {
                    clearInterval(animate);
                }
            }, 50);
        }

        // Update connection status indicator
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connectionStatus');
            if (connected) {
                statusElement.classList.remove('disconnected');
            } else {
                statusElement.classList.add('disconnected');
            }
        }

        // Disconnect WebSocket
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            isConnected = false;
            updateConnectionStatus(false);
        }

        // Call driver
        function callDriver() {
            const phone = document.getElementById('driverPhone').textContent;
            if (phone && phone !== '---') {
                window.location.href = `tel:${phone}`;
            } else {
                showToast('❌ Driver phone number not available');
            }
        }

        // Cancel ride
        function cancelRide() {
            if (confirm('Are you sure you want to cancel this ride?')) {
                fetch(`/api/bookings/${rideId}/cancel`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        showToast('✅ Ride cancelled successfully');
                        disconnect();
                        setTimeout(() => {
                            window.location.href = '/booking-dashboard';
                        }, 2000);
                    })
                    .catch(error => {
                        console.error('Error cancelling ride:', error);
                        showToast('❌ Failed to cancel ride');
                    });
            }
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            disconnect();
        });

        // Initialize map when Google Maps API is loaded (via callback parameter in script tag)
    </script>
</body>
</html>
