<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabEase - Cab Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/car-icons.css" rel="stylesheet">
    <link href="/css/premium-branding.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/home" data-text="CabEase">CabEase</a>
            <button class="navbar-toggler hamburger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/home">Home</a>
                    </li>
                    <li class="nav-item" th:if="${authenticated}">
                        <a class="nav-link" href="/bookings">My Bookings</a>
                    </li>
                    <li class="nav-item" th:if="${user != null and user.role == 'ADMIN'}">
                        <a class="nav-link" href="/admin/cabs">Manage Cabs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact Us</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" th:if="${!authenticated}">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item" th:if="${!authenticated}">
                        <a class="nav-link" href="/register">Register</a>
                    </li>
                    <li class="nav-item" th:if="${authenticated}">
                        <span class="navbar-text">Welcome, <span th:text="${user.username}"></span></span>
                    </li>
                    <li class="nav-item" th:if="${authenticated}">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div layout:fragment="content"></div>
    </div>

    <!-- Chatbot Widget -->
    <div id="chatbot-widget" class="position-fixed bottom-0 end-0 m-3" style="z-index: 1050;">
        <button id="chatbot-toggle" class="btn btn-primary d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; border-radius: 50%;">
            <span style="font-size: 24px;">💬</span>
        </button>
        <div class="mt-1 text-center">
            <small class="text-muted">AI Assistant</small>
        </div>
        <div id="chatbot-window" class="d-none bg-white border rounded shadow" style="width: 300px; height: 400px;">
            <div class="p-2 bg-primary text-white">CabEase Assistant</div>
            <div id="chat-messages" class="p-2" style="height: 300px; overflow-y: auto;"></div>
            <div class="p-2 border-top">
                <input type="text" id="chat-input" class="form-control" placeholder="Ask me anything...">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/chatbot.js"></script>
    <script src="/js/ui-animations.js"></script>
    <script src="/js/premium-features.js"></script>
</body>
</html>
