    <!-- Google Maps Geocoding API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjyzQGcwNLjqnE-aF0uaWaaJbIhLUZ9Ss&libraries=places"></script>
    <script>
        const geocoder = new google.maps.Geocoder();
        
        // Function to geocode address and store coordinates
        function geocodeAddress(type, locationName) {
            if (!locationName) {
                console.warn(`${type} location is empty`);
                return;
            }
            
            // Add "Chennai, Tamil Nadu, India" to get accurate results
            const fullAddress = locationName + ", Chennai, Tamil Nadu, India";
            
            console.log(`Geocoding ${type}: ${fullAddress}`);
            
            geocoder.geocode({ address: fullAddress }, function(results, status) {
                if (status === 'OK') {
                    const lat = results[0].geometry.location.lat();
                    const lng = results[0].geometry.location.lng();
                    
                    console.log(`✅ ${type} coordinates:`, lat, lng);
                    
                    if (type === 'pickup') {
                        document.getElementById('pickupLatitude').value = lat;
                        document.getElementById('pickupLongitude').value = lng;
                    } else if (type === 'drop') {
                        document.getElementById('dropLatitude').value = lat;
                        document.getElementById('dropLongitude').value = lng;
                    }
                } else {
                    console.error(`❌ Geocoding failed for ${type}: ${status}`);
                    alert(`Failed to get coordinates for ${locationName}. Please try selecting again or choose a different location.`);
                }
            });
        }
        
        // Validate form before submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            const pickupLat = document.getElementById('pickupLatitude').value;
            const pickupLng = document.getElementById('pickupLongitude').value;
            const dropLat = document.getElementById('dropLatitude').value;
            const dropLng = document.getElementById('dropLongitude').value;
            
            if (!pickupLat || !pickupLng || !dropLat || !dropLng) {
                e.preventDefault();
                alert('⚠️ Please wait for location coordinates to be loaded. If this persists, try selecting the locations again.');
                return false;
            }
            
            console.log('Form validation passed. Submitting with coordinates:', {
                pickup: { lat: pickupLat, lng: pickupLng },
                drop: { lat: dropLat, lng: dropLng }
            });
        });
    </script>
