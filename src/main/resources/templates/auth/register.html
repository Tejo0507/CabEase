<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Register - CabEase</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center" style="min-height: 80vh; align-items: center;">
            <div class="col-md-6 col-lg-5">
                <div class="card carbon-fiber" style="background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05)); border: 2px solid var(--primary); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 107, 0, 0.3);">
                    <div class="card-header text-center" style="background: var(--gradient-luxury); border-radius: 23px 23px 0 0;">
                        <h3 class="card-title mb-0" style="color: var(--dark); font-weight: 900;">
                            <i class="fas fa-crown"></i> Join CabEase Premium
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/register}" method="post" th:object="${user}">
                            <div class="form-group">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" 
                                       placeholder="Choose your username" required>
                                <i class="fas fa-user input-icon"></i>
                                <div th:if="${#fields.hasErrors('username')}" class="text-danger mt-1">
                                    <small><span th:errors="*{username}"></span></small>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" 
                                       placeholder="Enter your email address" required>
                                <i class="fas fa-envelope input-icon"></i>
                                <div th:if="${#fields.hasErrors('email')}" class="text-danger mt-1">
                                    <small><span th:errors="*{email}"></span></small>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" 
                                       placeholder="Create a secure password" required>
                                <i class="fas fa-lock input-icon"></i>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1">
                                    <small><span th:errors="*{password}"></span></small>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-submit racing-stripes">
                                <i class="fas fa-rocket"></i> Join the Elite
                            </button>
                        </form>
                        <div class="text-center mt-4">
                            <p style="color: rgba(255, 255, 255, 0.8);">
                                Already a member? 
                                <a href="/login" style="color: var(--accent); text-decoration: none; font-weight: bold;">
                                    <i class="fas fa-sign-in-alt"></i> Login here
                                </a>
                            </p>
                        </div>
                        
                        <!-- Premium benefits -->
                        <div class="mt-4 pt-3" style="border-top: 1px solid rgba(255, 107, 0, 0.3);">
                            <div class="text-center" style="color: rgba(255, 255, 255, 0.9);">
                                <small><i class="fas fa-star" style="color: var(--accent);"></i> Premium Benefits</small>
                                <div class="row mt-2">
                                    <div class="col-4 text-center">
                                        <div class="dashboard-light fuel" title="Priority Booking"></div>
                                        <small style="font-size: 0.7rem;">Priority</small>
                                    </div>
                                    <div class="col-4 text-center">
                                        <div class="dashboard-light battery" title="24/7 Support"></div>
                                        <small style="font-size: 0.7rem;">Support</small>
                                    </div>
                                    <div class="col-4 text-center">
                                        <div class="dashboard-light engine" title="Luxury Fleet"></div>
                                        <small style="font-size: 0.7rem;">Luxury</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
