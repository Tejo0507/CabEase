# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5800/cabease?TimeZone=Asia/Kolkata
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=cabease
spring.datasource.password=cabease_pass
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Set Hibernate timezone to Asia/Kolkata (India Standard Time)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

